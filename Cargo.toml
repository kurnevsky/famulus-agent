[package]
name = "famulus-agent"
version = "0.1.0"
edition = "2024"

# The crate is `famulus-agent`; the thing you type is `fa`.
[[bin]]
name = "fa"
path = "src/main.rs"

# Every grammar is a C parser that has to be compiled, so each one is a feature
# of its own: `--no-default-features` builds with no tree-sitter at all, and
# code blocks fall back to the single colour they had before.
[features]
default = ["languages", "mcp"]
# Tools from MCP servers, over stdio or streamable HTTP. Rig speaks the
# protocol through `rmcp`; this only finds the servers and hands their tools to
# the agent, so `--no-default-features` leaves the four built-in tools alone.
# A server that wants a login gets one over OAuth, and the tokens it hands
# back are kept in the system keyring through `oo7`.
mcp = ["dep:rmcp", "dep:http", "rig-agent/rmcp", "rmcp/auth", "dep:oo7", "dep:async-trait", "dep:reqwest", "dep:url"]
languages = [
  "lang-bash",
  "lang-c",
  "lang-c-sharp",
  "lang-cmake",
  "lang-cpp",
  "lang-css",
  "lang-dart",
  "lang-diff",
  "lang-elixir",
  "lang-erlang",
  "lang-fortran",
  "lang-gleam",
  "lang-go",
  "lang-haskell",
  "lang-html",
  "lang-ini",
  "lang-java",
  "lang-javascript",
  "lang-jsdoc",
  "lang-json",
  "lang-kotlin",
  "lang-lua",
  "lang-make",
  "lang-nix",
  "lang-ocaml",
  "lang-php",
  "lang-powershell",
  "lang-python",
  "lang-r",
  "lang-regex",
  "lang-ruby",
  "lang-rust",
  "lang-scala",
  "lang-sql",
  "lang-swift",
  "lang-toml",
  "lang-typescript",
  "lang-xml",
  "lang-yaml",
  "lang-zig",
]
# The machinery every grammar needs; pulled in by each language rather than
# selected on its own.
syntax = ["dep:tree-sitter", "dep:tree-sitter-highlight"]
lang-bash = ["syntax", "dep:tree-sitter-bash"]
lang-c = ["syntax", "dep:tree-sitter-c"]
lang-c-sharp = ["syntax", "dep:tree-sitter-c-sharp"]
lang-cmake = ["syntax", "dep:tree-sitter-cmake"]
lang-cpp = ["syntax", "dep:tree-sitter-cpp"]
lang-css = ["syntax", "dep:tree-sitter-css"]
lang-dart = ["syntax", "dep:tree-sitter-dart"]
lang-diff = ["syntax", "dep:tree-sitter-diff"]
lang-elixir = ["syntax", "dep:tree-sitter-elixir"]
lang-erlang = ["syntax", "dep:tree-sitter-erlang"]
lang-fortran = ["syntax", "dep:tree-sitter-fortran"]
lang-gleam = ["syntax", "dep:tree-sitter-gleam"]
lang-go = ["syntax", "dep:tree-sitter-go"]
lang-haskell = ["syntax", "dep:tree-sitter-haskell"]
lang-html = ["syntax", "dep:tree-sitter-html"]
lang-ini = ["syntax", "dep:tree-sitter-ini"]
lang-java = ["syntax", "dep:tree-sitter-java"]
lang-javascript = ["syntax", "dep:tree-sitter-javascript"]
# Both are grammars JavaScript injects rather than fences anyone writes: a
# regex literal and a JSDoc comment are parsed with them when they are on.
lang-jsdoc = ["syntax", "dep:tree-sitter-jsdoc"]
lang-json = ["syntax", "dep:tree-sitter-json"]
lang-kotlin = ["syntax", "dep:tree-sitter-kotlin-sg"]
lang-lua = ["syntax", "dep:tree-sitter-lua"]
lang-make = ["syntax", "dep:tree-sitter-make"]
lang-nix = ["syntax", "dep:tree-sitter-nix"]
lang-ocaml = ["syntax", "dep:tree-sitter-ocaml"]
lang-php = ["syntax", "dep:tree-sitter-php"]
lang-powershell = ["syntax", "dep:tree-sitter-powershell"]
lang-python = ["syntax", "dep:tree-sitter-python"]
lang-r = ["syntax", "dep:tree-sitter-r"]
lang-regex = ["syntax", "dep:tree-sitter-regex"]
lang-ruby = ["syntax", "dep:tree-sitter-ruby"]
lang-rust = ["syntax", "dep:tree-sitter-rust"]
lang-scala = ["syntax", "dep:tree-sitter-scala"]
lang-sql = ["syntax", "dep:tree-sitter-sequel"]
lang-swift = ["syntax", "dep:tree-sitter-swift"]
lang-toml = ["syntax", "dep:tree-sitter-toml-ng"]
# TypeScript's highlights build on JavaScript's, so it carries that grammar too.
lang-typescript = ["syntax", "lang-javascript", "dep:tree-sitter-typescript"]
lang-xml = ["syntax", "dep:tree-sitter-xml"]
lang-yaml = ["syntax", "dep:tree-sitter-yaml"]
lang-zig = ["syntax", "dep:tree-sitter-zig"]

[dependencies]
anyhow = "1.0.104"
# The shape rmcp gives the store an OAuth login is kept in.
async-trait = { version = "0.1.92", optional = true }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
# Only to name the headers an MCP endpoint is called with; already in the tree.
http = { version = "1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
markdown = "1"
mdstitch = "0.1"
nucleo-matcher = "0.3.1"
# The system keyring — Secret Service, or the portal inside a sandbox — which
# is where an MCP server's OAuth tokens are kept between sessions.
oo7 = { version = "0.6", optional = true }
ratatui = "0.30"
# The client rmcp calls a server with once it is signed in to, and the address
# the browser comes back to; both already in the tree through rmcp.
reqwest = { version = "0.13", default-features = false, optional = true }
ratatui-textarea = "0.9"
rig-agent = "0.42"
rig-core = "0.42"
rmcp = { version = "2", features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
], optional = true }
rustix = { version = "1", features = ["process"] }
# `preserve_order` keeps a tool's arguments in the order its struct
# declares them, rather than sorting them: the model tends to write them
# in the order it is offered them, and the path wants to come first.
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.20"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-cmake = { version = "0.7", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-diff = { version = "0.1", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-erlang = { version = "0.20", optional = true }
tree-sitter-fortran = { version = "0.6", optional = true }
tree-sitter-gleam = { version = "1.0", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-highlight = { version = "0.27", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-ini = { version = "1.4", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-jsdoc = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
# The grammar tree-sitter's own `tree-sitter-kotlin` became: that one is still
# pinned to tree-sitter 0.21 and will not build here.
tree-sitter-kotlin-sg = { version = "0.4", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-make = { version = "1.1", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-ocaml = { version = "0.26", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-r = { version = "1.3", optional = true }
tree-sitter-regex = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
# SQL, under the name its author gave it; `tree-sitter-sql` is a 2021 stub.
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
unicode-normalization = "0.1.25"
unicode-width = "0.2"
url = { version = "2", optional = true }
uuid = { version = "1.26.1", features = ["v4"] }
